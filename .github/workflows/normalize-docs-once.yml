name: Normalize developer handbook names

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize technical names
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path('docs/03_Standards_Developpement.md'),
              Path('docs/04_UI_Guidelines.md'),
              Path('docs/05_Internal_API.md'),
              Path('docs/06_AI_Development_Guide.md'),
          ]

          replacements = [
              ('lib/common/publisher_export.py', 'lib/export/export_service.py'),
              ('PublisherAI.pushbutton', 'Export.pushbutton'),
              ('RoomCalculator.pushbutton', 'Calculs.pushbutton'),
              ('PublisherAIController', 'ExportController'),
              ('PublisherAIService', 'ExportService'),
              ('RoomCalculatorController', 'CalculsPiecesController'),
              ('RoomCalculatorService', 'CalculsPiecesService'),
              ('RoomParameterWriter', 'PieceParameterWriter'),
              ('RoomCalculator', 'CalculsPieces'),
              ('PublisherAI', 'Export'),
              ('Publication.panel', 'Export.panel'),
              ('Calcul.panel', 'Calculs.panel'),
              ('Quality Control', 'Controle'),
          ]

          changed = []
          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Modified:', ', '.join(changed) if changed else 'none')

      - name: Commit normalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/03_Standards_Developpement.md docs/04_UI_Guidelines.md docs/05_Internal_API.md docs/06_AI_Development_Guide.md
          if git diff --cached --quiet; then
            echo 'No documentation changes required.'
            exit 0
          fi
          git commit -m 'docs: normalize technical names in handbook'
          git push
