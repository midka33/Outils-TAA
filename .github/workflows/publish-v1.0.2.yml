name: Publish Outils TAA v1.0.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v1.0.2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "Outils-TAA_v1.0.2"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "OutilsTAA.extension" (Join-Path $stage "OutilsTAA.extension") -Recurse

          # La release v1.0.2 distribue uniquement Export + Calculs des pieces.
          $plansVente = Join-Path $stage "OutilsTAA.extension\OutilsTAA.tab\PlansDeVente.panel"
          if (Test-Path $plansVente) {
            Remove-Item $plansVente -Recurse -Force
          }

          Copy-Item "docs\release\Tutoriel_Export_v1.0.2.md" $stage
          Copy-Item "docs\release\Tutoriel_Calculs_Pieces_v1.0.2.md" $stage

          @'
          OUTILS TAA - RELEASE 1.0.2

          Modules :
          - Export
          - Calculs des pieces

          Nouveaute v1.0.2 :
          - Export affiche une progression globale de 0 a 100 pour la publication.
          - Le pourcentage repose sur les operations reellement traitees.

          Calculs des pieces :
          - comportement v1.0.1 conserve pour les pieces dans des groupes.

          Compatibilite :
          - Autodesk Revit 2025.4
          - pyRevit 5.x
          '@ | Set-Content (Join-Path $stage "LISEZ_MOI.txt") -Encoding UTF8

          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath "Outils-TAA_v1.0.2.zip" -Force

          $installer = @'
          @echo off
          setlocal
          title Installation Outils TAA v1.0.2
          set "ROOT=%APPDATA%\pyRevit\Extensions\Outils-TAA"
          set "DEST=%ROOT%\OutilsTAA.extension"
          set "TMP=%TEMP%\OutilsTAA_v102"

          echo Outils TAA v1.0.2 - installation utilisateur
          echo.

          if exist "%TMP%" rmdir /S /Q "%TMP%"
          mkdir "%TMP%"

          powershell -NoProfile -ExecutionPolicy Bypass -Command "Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/midka33/Outils-TAA/releases/download/v1.0.2/Outils-TAA_v1.0.2.zip' -OutFile '%TMP%\release.zip'; Expand-Archive -Path '%TMP%\release.zip' -DestinationPath '%TMP%\release' -Force"
          if errorlevel 1 goto :error

          if exist "%ROOT%" (
            if exist "%ROOT%_backup" rmdir /S /Q "%ROOT%_backup"
            move "%ROOT%" "%ROOT%_backup" >nul 2>&1
          )

          mkdir "%ROOT%" >nul 2>&1
          xcopy "%TMP%\release\OutilsTAA.extension" "%DEST%\" /E /I /Y >nul

          echo.
          echo Installation terminee.
          echo.
          echo Si necessaire, ajouter ce dossier dans pyRevit ^> Settings ^> Custom Extension Directories :
          echo %ROOT%
          echo.
          echo Fermez puis relancez Revit, ou utilisez Reload dans pyRevit.
          goto :end

          :error
          echo.
          echo Echec de l'installation. Verifiez la connexion Internet.

          :end
          if exist "%TMP%" rmdir /S /Q "%TMP%"
          pause
          '@

          Set-Content -Path "INSTALLER_Outils_TAA_v1.0.2.cmd" -Value $installer -Encoding ASCII

      - name: Publish or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          # Outils TAA v1.0.2

          Release des modules **Export** et **Calculs des pieces**.

          ## Export — nouveaute v1.0.2
          - nouvelle fenetre de progression globale de 0 a 100 % pendant la publication ;
          - carnet courant, phase et compteur d'unites visibles ;
          - progression fondee sur les operations reellement terminees ;
          - aucun faux pourcentage feuille par feuille pendant un appel natif Revit bloquant ;
          - la fenetre se ferme avant l'ouverture du rapport final existant.

          Validation automatisee : **257 tests Export reussis hors Revit**, GitHub Actions au vert.

          ## Calculs des pieces
          La release conserve le comportement de la v1.0.1 :
          - prise en charge des pieces placees dans des groupes lorsque le parametre destination est aligne par type de groupe ;
          - deverrouillage temporaire pendant la transaction ;
          - restauration automatique de l'alignement ;
          - rollback de securite en cas de valeurs divergentes.

          La resolution interactive des divergences de groupes reste hors de cette release.

          ## Modules distribues
          - **Export**
          - **Calculs des pieces**

          **Plans de vente n'est pas inclus dans le package.**

          ## Compatibilite
          - Autodesk Revit 2025.4
          - pyRevit 5.x

          ## Installation / mise a jour
          1. Telecharger `INSTALLER_Outils_TAA_v1.0.2.cmd`.
          2. Fermer Revit.
          3. Lancer l'installateur.
          4. Relancer Revit ou utiliser Reload dans pyRevit.

          Aucun droit administrateur n'est requis.

          ## Tutoriels
          Les tutoriels Export et Calculs des pieces sont joints a cette release et inclus dans le ZIP.
          '@

          Set-Content -Path "release-notes.md" -Value $notes -Encoding UTF8

          $assets = @(
            "Outils-TAA_v1.0.2.zip",
            "INSTALLER_Outils_TAA_v1.0.2.cmd",
            "docs/release/Tutoriel_Export_v1.0.2.md",
            "docs/release/Tutoriel_Calculs_Pieces_v1.0.2.md"
          )

          gh release view v1.0.2 *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release v1.0.2 deja existante : mise a jour."
            gh release edit v1.0.2 --title "Outils TAA v1.0.2" --notes-file "release-notes.md"
            gh release upload v1.0.2 @assets --clobber
          }
          else {
            Write-Host "Creation de la release v1.0.2."
            gh release create v1.0.2 @assets --title "Outils TAA v1.0.2" --notes-file "release-notes.md" --target "${{ github.sha }}"
          }
