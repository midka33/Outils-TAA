name: Publish Outils TAA v1.0.3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v1.0.3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Tests Export
        run: >-
          python -m pytest tests OutilsTAA.extension/OutilsTAA.tab/Export.panel/tests
          --ignore=tests/calculation --ignore=tests/plans_vente --import-mode=importlib -q

      - name: Tests Calculs des pièces
        run: python -m pytest tests/calculation -q

  release:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "Outils-TAA_v1.0.3"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "OutilsTAA.extension" (Join-Path $stage "OutilsTAA.extension") -Recurse

          # La release v1.0.3 distribue uniquement Export + Calculs des pieces.
          $plansVente = Join-Path $stage "OutilsTAA.extension\OutilsTAA.tab\PlansDeVente.panel"
          if (Test-Path $plansVente) {
            Remove-Item $plansVente -Recurse -Force
          }

          Copy-Item "docs\release\Tutoriel_Export_v1.0.3.md" $stage
          Copy-Item "docs\release\Tutoriel_Calculs_Pieces_v1.0.3.md" $stage

          @'
          OUTILS TAA - RELEASE 1.0.3

          Modules distribues :
          - Export
          - Calculs des pieces

          Export v1.0.3 :
          - reglages DWG Revit accessibles depuis Outils TAA ;
          - fusion vues/liens independante de la strategie d'export ;
          - strategie DWG automatique ;
          - dossiers Nom du carnet/PDF et Nom du carnet/DWG ;
          - renommage post-export des DWG selon la regle TAA ;
          - nommage correct des PDF combines au niveau du carnet ;
          - progression detaillee et fenetre stable.

          Calculs des pieces v1.0.3 :
          - ouverture optimisee sur les gros projets ;
          - un seul scan des parametres ;
          - cache local des metadonnees invariantes ;
          - comportement groupe/rollback conserve.

          Compatibilite :
          - Autodesk Revit 2025.4
          - pyRevit 5.x
          '@ | Set-Content (Join-Path $stage "LISEZ_MOI.txt") -Encoding UTF8

          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath "Outils-TAA_v1.0.3.zip" -Force

          $installer = @'
          @echo off
          setlocal
          title Installation Outils TAA v1.0.3

          set "ROOT=%APPDATA%\pyRevit\Extensions"
          set "DEST=%ROOT%\OutilsTAA.extension"
          set "LEGACY_ROOT=%ROOT%\Outils-TAA"
          set "LEGACY_DEST=%LEGACY_ROOT%\OutilsTAA.extension"
          set "BACKUP_ROOT=%APPDATA%\OutilsTAA\Backups\v1.0.3"
          set "TMP=%TEMP%\OutilsTAA_v103"

          echo Outils TAA v1.0.3 - installation utilisateur
          echo.

          if exist "%TMP%" rmdir /S /Q "%TMP%"
          mkdir "%TMP%"

          powershell -NoProfile -ExecutionPolicy Bypass -Command "Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/midka33/Outils-TAA/releases/download/v1.0.3/Outils-TAA_v1.0.3.zip' -OutFile '%TMP%\release.zip'; Expand-Archive -Path '%TMP%\release.zip' -DestinationPath '%TMP%\release' -Force"
          if errorlevel 1 goto :error

          if not exist "%ROOT%" mkdir "%ROOT%"

          if exist "%BACKUP_ROOT%" rmdir /S /Q "%BACKUP_ROOT%"
          mkdir "%BACKUP_ROOT%" >nul 2>&1

          if exist "%DEST%" (
            move "%DEST%" "%BACKUP_ROOT%\OutilsTAA.extension_standard_previous" >nul
          )

          rem Migration de l'ancien emplacement utilise par les releases precedentes.
          if exist "%LEGACY_DEST%" (
            move "%LEGACY_DEST%" "%BACKUP_ROOT%\OutilsTAA.extension_legacy_previous" >nul
          )

          xcopy "%TMP%\release\OutilsTAA.extension" "%DEST%\" /E /I /Y >nul
          if errorlevel 1 goto :restore

          if exist "%LEGACY_ROOT%" rmdir "%LEGACY_ROOT%" >nul 2>&1

          echo.
          echo Installation terminee.
          echo Outils TAA est installe dans le dossier standard pyRevit :
          echo %DEST%
          echo.
          echo Les anciennes installations eventuelles ont ete sauvegardees dans :
          echo %BACKUP_ROOT%
          echo.
          echo Fermez puis relancez Revit, ou utilisez Reload dans pyRevit.
          goto :end

          :restore
          echo.
          echo Echec de la copie. Tentative de restauration de l'installation precedente.
          if exist "%DEST%" rmdir /S /Q "%DEST%"
          if exist "%BACKUP_ROOT%\OutilsTAA.extension_standard_previous" (
            move "%BACKUP_ROOT%\OutilsTAA.extension_standard_previous" "%DEST%" >nul
          )
          goto :error

          :error
          echo.
          echo Echec de l'installation. Verifiez la connexion Internet et les droits d'ecriture du dossier pyRevit.

          :end
          if exist "%TMP%" rmdir /S /Q "%TMP%"
          pause
          '@

          Set-Content -Path "INSTALLER_Outils_TAA_v1.0.3.cmd" -Value $installer -Encoding ASCII

      - name: Publish or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          # Outils TAA v1.0.3

          Release des modules **Export** et **Calculs des pieces** pour Revit 2025.4 / pyRevit 5.x.

          ## Export
          - acces aux configurations DWG natives Revit depuis Outils TAA ;
          - option explicite pour fusionner les vues et liens dans chaque DWG ;
          - suppression du choix technique Par feuille / Lot Revit : la strategie est automatique ;
          - structure de sortie claire : Nom du carnet/PDF et Nom du carnet/DWG ;
          - renommage des DWG apres le lot Revit selon la regle de nommage TAA ;
          - correction du PDF combine qui reprenait le nom de la premiere feuille ;
          - progression globale 0-100 % enrichie par la progression native Revit lorsqu'elle est disponible ;
          - compteur reel X / Y mises en page pendant les traitements controles par Outils TAA ;
          - fenetre de progression a taille stable.

          Le workflow principal Export a ete valide par l'utilisateur dans Revit 2025.4.

          Validation automatisee : **301 tests Export reussis hors Revit**.

          ## Calculs des pieces
          - comportement securise des parametres de pieces dans les groupes conserve ;
          - ouverture acceleree : un seul scan des pieces/parametres ;
          - cache local des metadonnees de parametres partagees ;
          - ouverture observee autour de **3 secondes** sur le projet de validation d'environ 80 logements.

          Validation automatisee : **79 tests Calculs reussis hors Revit**.

          La resolution interactive des divergences entre occurrences de groupes reste hors de cette release.

          ## Modules distribues
          - **Export**
          - **Calculs des pieces**

          **Plans de vente n'est pas inclus dans le package.**

          ## Installation / mise a jour
          1. Fermer Revit.
          2. Telecharger et lancer `INSTALLER_Outils_TAA_v1.0.3.cmd`.
          3. Relancer Revit ou utiliser Reload dans pyRevit.

          Aucun droit administrateur n'est requis.

          La v1.0.3 installe desormais directement l'extension dans le dossier standard :
          `%APPDATA%\pyRevit\Extensions\OutilsTAA.extension`.

          L'installateur migre et sauvegarde une ancienne installation v1.0.x eventuelle afin d'eviter les doublons.

          ## Tutoriels
          Les tutoriels Export et Calculs des pieces sont joints a la release et inclus dans le ZIP.
          '@

          Set-Content -Path "release-notes.md" -Value $notes -Encoding UTF8

          $assets = @(
            "Outils-TAA_v1.0.3.zip",
            "INSTALLER_Outils_TAA_v1.0.3.cmd",
            "docs/release/Tutoriel_Export_v1.0.3.md",
            "docs/release/Tutoriel_Calculs_Pieces_v1.0.3.md"
          )

          gh release view v1.0.3 *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release v1.0.3 deja existante : mise a jour."
            gh release edit v1.0.3 --title "Outils TAA v1.0.3" --notes-file "release-notes.md"
            gh release upload v1.0.3 @assets --clobber
          }
          else {
            Write-Host "Creation de la release v1.0.3."
            gh release create v1.0.3 @assets --title "Outils TAA v1.0.3" --notes-file "release-notes.md" --target "${{ github.sha }}"
          }
