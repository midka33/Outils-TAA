name: Repository maintenance finalizer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repository-maintenance-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Supprimer les branches de maintenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for branch in             chore/repository-cleanup             chore/repository-maintenance-fix             chore/repository-maintenance-finalize
          do
            if gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
              echo "Supprimée : $branch"
            else
              echo "Déjà absente : $branch"
            fi
          done

      - name: Retirer les workflows de maintenance de main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for path in             .github/workflows/repository-maintenance-once.yml             .github/workflows/repository-maintenance-finalize.yml
          do
            sha="$(gh api "repos/$REPO/contents/$path?ref=main" --jq '.sha' 2>/dev/null || true)"
            if [ -n "$sha" ]; then
              gh api --method DELETE "repos/$REPO/contents/$path"                 -f message="chore(repo): retirer le workflow de maintenance temporaire"                 -f sha="$sha"                 -f branch="main" >/dev/null
              echo "Retiré de main : $path"
            else
              echo "Déjà absent : $path"
            fi
          done
