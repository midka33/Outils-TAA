name: Annotations Beta static tests

on:
  push:
    branches: ["feature/annotations-automatiques-beta"]
  pull_request:
    paths:
      - "OutilsTAA.extension/OutilsTAA.tab/Annotations.panel/**"
      - "tests/annotations/**"
      - ".github/workflows/annotations-tests.yml"

jobs:
  syntax-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run static annotation tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/annotations
