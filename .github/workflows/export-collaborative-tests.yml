name: Export — configuration collaborative

on:
  pull_request:
    paths:
      - "OutilsTAA.extension/OutilsTAA.tab/Export.panel/**"
      - "tests/test_export_collaborative_*.py"
      - "tests/test_export_local_config_migration.py"
      - "tests/test_export_storage_bootstrap.py"
      - "docs/27_Export_Configuration_Collaborative.md"
      - "docs/28_Export_Recette_Collaborative_Revit.md"
      - ".github/workflows/export-collaborative-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collaborative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Contrats collaboratifs automatisables
        run: >-
          python -m pytest
          tests/test_export_collaborative_storage.py
          tests/test_export_shared_json_storage.py
          tests/test_export_collaborative_repository.py
          tests/test_export_storage_bootstrap.py
          tests/test_export_collaborative_ui.py
          tests/test_export_local_config_migration.py
          tests/test_export_collaborative_acceptance.py
          --import-mode=importlib -q
