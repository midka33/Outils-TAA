name: Calculs des pièces — tests hors Revit

on:
  pull_request:
    paths:
      - "OutilsTAA.extension/OutilsTAA.tab/Calculs.panel/**"
      - "OutilsTAA.extension/lib/calculation/**"
      - "OutilsTAA.extension/lib/common/**"
      - "tests/calculation/**"
      - ".github/workflows/calculs-tests.yml"

jobs:
  tests-calculs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Tests Calculs des pièces
        run: python -m pytest tests/calculation -q
