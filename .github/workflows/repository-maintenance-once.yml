          BRANCHES
          echo "Branches supprimées : $deleted"
          echo "Branches ignorées : $skipped"
          echo "### Nettoyage branches" >> "$GITHUB_STEP_SUMMARY"
          echo "- Supprimées : $deleted" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ignorées / déjà absentes : $skipped" >> "$GITHUB_STEP_SUMMARY"

  try-protect-main:
    runs-on: ubuntu-latest
    steps:
      - name: Tenter d'activer une ruleset de protection main
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cat > /tmp/ruleset.json <<'JSON'
          {
            "name": "Protect main — Outils TAA",
            "target": "branch",
            "enforcement": "active",
            "conditions": {
              "ref_name": {
                "include": ["~DEFAULT_BRANCH"],
                "exclude": []
              }
            },
            "rules": [
              {"type": "deletion"},
              {"type": "non_fast_forward"},
              {
                "type": "pull_request",
                "parameters": {
                  "dismiss_stale_reviews_on_push": false,
                  "require_code_owner_review": false,
                  "require_last_push_approval": false,
                  "required_approving_review_count": 0,
                  "required_review_thread_resolution": true
                }
              },
              {
                "type": "required_status_checks",
                "parameters": {
                  "strict_required_status_checks_policy": true,
                  "do_not_enforce_on_create": true,
                  "required_status_checks": [
                    {"context": "tests-calculs"},
                    {"context": "tests-plans-vente"},
                    {"context": "export"},
                    {"context": "test-export-ribbon"}
                  ]
                }
              }
            ],
            "bypass_actors": []
          }
          JSON
          if gh api --method POST "repos/$REPO/rulesets" --input /tmp/ruleset.json >/tmp/ruleset-result.json 2>/tmp/ruleset-error.txt; then
            echo "Protection main créée."
            echo "### Protection main" >> "$GITHUB_STEP_SUMMARY"
            echo "- Ruleset créée avec PR obligatoire et CI obligatoires." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Impossible d'activer la protection avec GITHUB_TOKEN."
            cat /tmp/ruleset-error.txt
            echo "### Protection main" >> "$GITHUB_STEP_SUMMARY"
            echo "- Échec : le token Actions n'a pas les droits Administration nécessaires." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
