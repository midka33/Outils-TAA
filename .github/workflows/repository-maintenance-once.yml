name: Repository maintenance once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repository-maintenance-once.yml"

permissions:
  contents: write

jobs:
  cleanup-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Supprimer uniquement les refs auditées
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deleted=0
          skipped=0
          while IFS='|' read -r branch expected; do
            [ -z "$branch" ] && continue
            current="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            if [ -z "$current" ]; then
              echo "Déjà absente : $branch"
              skipped=$((skipped + 1))
              continue
            fi
            if [ "$current" != "$expected" ]; then
              echo "SKIP $branch : head déplacée ($current != $expected)"
              skipped=$((skipped + 1))
              continue
            fi
            gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
            echo "Supprimée : $branch"
            deleted=$((deleted + 1))
          done <<'BRANCHES'
          stage08-bridge|1e70a2d714da6b0f6c14681929fcfb42da9e0201
          stage08-bridge-real|1e70a2d714da6b0f6c14681929fcfb42da9e0201
