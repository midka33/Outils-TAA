name: Plans de vente — tests hors Revit

on:
  push:
    branches:
      - "feature/plans-de-vente-*"
    paths:
      - "OutilsTAA.extension/OutilsTAA.tab/PlansDeVente.panel/**"
      - "OutilsTAA.extension/lib/plans_vente/**"
      - "tests/plans_vente/**"
      - ".github/workflows/plans-vente-tests.yml"
  pull_request:
    paths:
      - "OutilsTAA.extension/OutilsTAA.tab/PlansDeVente.panel/**"
      - "OutilsTAA.extension/lib/plans_vente/**"
      - "tests/plans_vente/**"
      - ".github/workflows/plans-vente-tests.yml"

jobs:
  tests-plans-vente:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Tests Plans de vente
        env:
          PYTHONPATH: ${{ github.workspace }}/OutilsTAA.extension/lib
        run: python -m pytest tests/plans_vente -q
